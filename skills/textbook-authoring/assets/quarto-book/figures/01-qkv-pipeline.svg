<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="383" viewBox="0 0 1084 383" role="img" aria-labelledby="title desc"><title id="title">Self-Attentionの処理の流れ</title><desc id="desc">QとKの照合、Softmax、Vの重み付き和を区別する模式図</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8297ad"/></marker></defs><rect width="1084" height="383" rx="20" fill="#f7fafc"/><text x="38" y="48" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#18314e" font-weight="700" text-anchor="start">1｜照合の計算と情報の集約</text><text x="38" y="78" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="15" fill="#64778a" font-weight="400" text-anchor="start">Q・Kが重みを決め、Vが集約される。矢印はデータの流れ。</text><rect x="38" y="116" width="242" height="66" rx="13" fill="#ffffff" stroke="#2569ac" stroke-width="1.7"/><text x="57" y="143" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="20" fill="#2569ac" font-weight="700" text-anchor="start">Query：Q</text><text x="57" y="167" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="14" fill="#64778a" font-weight="400" text-anchor="start">何を照合するか</text><rect x="38" y="201" width="242" height="66" rx="13" fill="#ffffff" stroke="#14877c" stroke-width="1.7"/><text x="57" y="228" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="20" fill="#14877c" font-weight="700" text-anchor="start">Key：K</text><text x="57" y="252" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="14" fill="#64778a" font-weight="400" text-anchor="start">照合される手掛かり</text><rect x="38" y="286" width="242" height="66" rx="13" fill="#ffffff" stroke="#b9751e" stroke-width="1.7"/><text x="57" y="313" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="20" fill="#b9751e" font-weight="700" text-anchor="start">Value：V</text><text x="57" y="337" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="14" fill="#64778a" font-weight="400" text-anchor="start">集約する内容</text><rect x="338" y="149" width="186" height="114" rx="13" fill="#e8f0fa" stroke="#a9c5df" stroke-width="1.7"/><text x="431" y="190" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#2569ac" font-weight="700" text-anchor="middle">QKᵀ / √dₖ</text><text x="431" y="223" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="16" fill="#64778a" font-weight="400" text-anchor="middle">位置間のスコア</text><rect x="586" y="149" width="178" height="114" rx="13" fill="#e4f5f1" stroke="#a1d5ca" stroke-width="1.7"/><text x="675" y="193" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="23" fill="#14877c" font-weight="700" text-anchor="middle">Softmax</text><text x="675" y="225" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="15" fill="#64778a" font-weight="400" text-anchor="middle">Attention重み</text><rect x="822" y="149" width="224" height="114" rx="13" fill="#fff4e5" stroke="#efcf96" stroke-width="1.7"/><text x="934" y="193" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="23" fill="#b9751e" font-weight="700" text-anchor="middle">重み付き和</text><text x="934" y="226" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="16" fill="#25394e" font-weight="400" text-anchor="middle">出力 Z = AV</text><path d="M280 147 L338 178" fill="none" stroke="#8297ad" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M280 233 L338 233" fill="none" stroke="#8297ad" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M524 207 L586 207" fill="none" stroke="#8297ad" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M764 207 L822 207" fill="none" stroke="#8297ad" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M280 319 L807 319" fill="none" stroke="#8297ad" stroke-width="2.5"  /><path d="M807 319 L807 246" fill="none" stroke="#8297ad" stroke-width="2.5"  /><path d="M807 246 L822 246" f