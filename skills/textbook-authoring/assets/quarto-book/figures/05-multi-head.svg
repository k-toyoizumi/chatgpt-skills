<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="419" viewBox="0 0 1084 419" role="img" aria-labelledby="title desc"><title id="title">Multi-Head Attentionの概念図</title><desc id="desc">入力が異なる射影による複数ヘッドへ分岐し、結合後に出力射影される</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8297ad"/></marker></defs><rect width="1084" height="419" rx="20" fill="#f7fafc"/><text x="35" y="45" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="24" fill="#18314e" font-weight="700" text-anchor="start">5｜Multi-Head は射影の異なる Attention を並列化</text><text x="35" y="74" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="15" fill="#64778a" font-weight="400" text-anchor="start">役割があらかじめ固定されているのではなく、各ヘッドの射影行列が学習される。</text><rect x="36" y="171" width="137" height="87" rx="13" fill="#e8eff9" stroke="#aac6e0" stroke-width="1.7"/><text x="105" y="205" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="24" fill="#2569ac" font-weight="700" text-anchor="middle">入力 X</text><text x="105" y="234" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="15" fill="#64778a" font-weight="400" text-anchor="middle">n × dmodel</text><rect x="263" y="100" width="223" height="74" rx="13" fill="#ffffff" stroke="#2569ac" stroke-width="1.7"/><text x="282" y="130" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="20" fill="#2569ac" font-weight="700" text-anchor="start">head 1</text><text x="282" y="156" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="13" fill="#64778a" font-weight="400" text-anchor="start">各ヘッドで Q, K, V → A V</text><path d="M173 213 L222 213" fill="none" stroke="#8297ad" stroke-width="2.5"  /><path d="M222 213 L222 137" fill="none" stroke="#8297ad" stroke-width="2.5"  /><path d="M222 137 L263 137" fill="none" stroke="#8297ad" stroke-width="2.5"  marker-end="url(#arr)"/><path d="M486 137 L565 137" fill