<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="365" viewBox="0 0 1088 365" role="img" aria-labelledby="title desc"><title id="title">Attention計算のテンソル形状</title><desc id="desc">Qはn掛けるdk、K転置はdk掛けるn、Aはn掛けるn、VとZはn掛けるdv</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8297ad"/></marker></defs><rect width="1088" height="365" rx="20" fill="#f7fafc"/><text x="34" y="44" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#18314e" font-weight="700" text-anchor="start">2｜行列の形状を追う</text><text x="34" y="72" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="15" fill="#64778a" font-weight="400" text-anchor="start">同じ n でも、注意行列と特徴表現は別の次元を持つ。</text><rect x="34" y="120" width="178" height="121" rx="13" fill="#ffffff" stroke="#d8e3ed" stroke-width="1.7"/><rect x="46" y="133" width="154" height="8" rx="5" fill="#2569ac" stroke="#2569ac" stroke-width="0"/><text x="123" y="183" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="28" fill="#2569ac" font-weight="700" text-anchor="middle">Q</text><text x="123" y="213" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="18" fill="#64778a" font-weight="500" text-anchor="middle">n × dₖ</text><text x="227" y="186" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#64778a" font-weight="600" text-anchor="middle">×</text><rect x="240" y="120" width="178" height="121" rx="13" fill="#ffffff" stroke="#d8e3ed" stroke-width="1.7"/><rect x="252" y="133" width="154" height="8" rx="5" fill="#2569ac" stroke="#2569ac" stroke-width="0"/><text x="329" y="183" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="28" fill="#2569ac" font-weight="700" text-anchor="middle">Kᵀ</text><text x="329" y="213" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="18" fill="#64778a" font-weight="500" text-anchor="middle">dₖ × n</text><text x="433" y="186" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#64778a" font-weight="600" text-anchor="middle">→</text><rect x="449" y="120" width="178" height="121" rx="13" fill="#ffffff" stroke="#d8e3ed" stroke-width="1.7"/><rect x="461" y="133" width="154" height="8" rx="5" fill="#14877c" stroke="#14877c" stroke-width="0"/><text x="538" y="183" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="28" fill="#14877c" font-weight="700" text-anchor="middle">A</text><text x="538" y="213" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="18" fill="#64778a" font-weight="500" text-anchor="middle">n × n</text><text x="642" y="186" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#64778a" font-weight="600" text-anchor="middle">×</text><rect x="665" y="120" width="178" height="121" rx="13" fill="#ffffff" stroke="#d8e3ed" stroke-width="1.7"/><rect x="677" y="133" width="154" height="8" rx="5" fill="#b9751e" stroke="#b9751e" stroke-width="0"/><text x="754" y="183" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="28" fill="#b9751e" font-weight="700" text-anchor="middle">V</text><text x="754" y="213" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="18" fill="#64778a" font-weight="500" text-anchor="middle">n × dᵥ</text><text x="858" y="186" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="25" fill="#64778a" font-weight="600" text-anchor="middle">=</text><rect x="874" y="120" width="178" height="121" rx="13" fill="#ffffff" stroke="#d8e3ed" stroke-width="1.7"/><rect x="886" y="133" width="154" height="8" rx="5" fill="#18314e" stroke="#18314e" stroke-width="0"/><text x="963" y="183" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="28" fill="#18314e" font-weight="700" text-anchor="middle">Z</text><text x="963" y="213" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="18" fill="#64778a" font-weight="500" text-anchor="middle">n × dᵥ</text><rect x="105" y="286" width="855" height="51" rx="13" fill="#e8f1f9" stroke="#c6d9ea" stroke-width="1.7"/><text x="532" y="318" font-family="Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif" font-size="17" fill="#2569ac" font-weight="500" text-anchor="middle">A の各行は「ある Query が、どの Key を参照するか」の分布</text></svg>